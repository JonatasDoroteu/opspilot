name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  python-tests:
    name: Testes Python
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/opspilot
      N8N_WEBHOOK_URL: http://localhost:5678/webhook/incident-created
      OPSPILOT_API_KEY: ci-test-api-key
      API_KEY: ci-test-api-key
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio aiosqlite

      - name: Executar testes
        run: pytest -q

  compose-validation:
    name: Validar Docker Compose
    runs-on: ubuntu-latest
    env:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: opspilot
      N8N_BASIC_AUTH_USER: admin
      N8N_BASIC_AUTH_PASSWORD: ci-placeholder-password
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validar configuração do Compose
        run: docker compose config